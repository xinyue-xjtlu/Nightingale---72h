<!DOCTYPE html>
<html>
<head>
    <title>Select Patient</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #0d2b4a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; }
        .container h1 { color: white; font-size: 28px; margin-bottom: 30px; }
        .card-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .card {
            background: #1a3c5e;
            color: white;
            padding: 30px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-width: 140px;
            text-align: center;
        }
        .card:hover { transform: translateY(-5px); background: #1e4a72; }
        .back { color: rgba(255,255,255,0.5); display: block; margin-top: 20px; text-decoration: none; font-size: 14px; }
        .back:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select Your Name</h1>
        <div class="card-grid">
            {% for patient in patients %}
            <a href="/patient/{{ patient.id }}" class="card">
                {{ patient.name }}
            </a>
            {% endfor %}
        </div>
        <a href="/logout" class="back">← Logout</a>
    </div>
</body>
</html>
