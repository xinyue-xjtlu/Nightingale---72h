<!DOCTYPE html>
<html>
<head>
    <title>Patient</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .header { background: #1a3c5e; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .highlight { background: #fff3cd; border: 2px solid #ffc107; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .card h3 { color: #1a3c5e; margin-bottom: 5px; font-size: 16px; }
        .card p { color: #333; font-size: 14px; }
        .logout { background: #dc3545; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Patient View</h2>
            <p style="opacity:0.8;">{{ patient.name }}</p>
        </div>
        <div class="highlight">
       <h3>To Do</h3> 
       <p>{{ patient.nurse_instructions }}</p>
        </div>

        <div class="card">
            <h3>Your Story</h3>
            <p>{{ patient.patient_story }}</p>
        </div>

        <div class="card">
            <h3>Doctor Diagnosis</h3>
            <p>{{ patient.doctor_diagnosis }}</p>
        </div>

        <a href="/logout"><button class="logout">Logout</button></a>
    </div>
</body>
</html>
