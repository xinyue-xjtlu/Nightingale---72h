<!DOCTYPE html>
<html>
<head>
    <title>History</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .header { background: #1a3c5e; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .entry { background: white; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .highlight { background: #fff3cd; border: 2px solid #ffc107; }
        .entry .meta { color: #666; font-size: 12px; margin-bottom: 6px; }
        .entry p { font-size: 14px; color: #333; white-space: pre-wrap; }
        .latest-tag { display: inline-block; background: #1a3c5e; color: white; font-size: 11px;
                      padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
        .back { display: inline-block; margin-top: 10px; color: #1a3c5e; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{ field_label }} History</h2>
            <p style="opacity:0.8;">{{ patient.name }} ({{ patient.age }})</p>
        </div>

        {% for entry in entries %}
        <div class="entry {% if loop.first %}highlight{% endif %}">
            {% if loop.first %}<span class="latest-tag">LATEST</span>{% endif %}
            <div class="meta">{{ entry.time }} — {{ entry.author }}</div>
            <p>{{ entry.text }}</p>
        </div>
        {% endfor %}

        <a class="back" href="{{ back_url }}">← Back</a>
    </div>
</body>
</html>
